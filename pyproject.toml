[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "llm-orchestrator"
version = "0.1.0"
description = "A reusable, provider-agnostic LLM orchestration library."
readme = "README.md"
requires-python = ">=3.11"
keywords = ["llm", "orchestration", "providers", "reliability", "abstraction"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]

# Runtime dependencies:
#   pydantic      - contract validation, immutability, serialization (Phase 2)
#   google-genai  - the official Google Gemini SDK (Phase 4, GeminiProvider only)
#   groq          - the official Groq SDK (Phase 5, GroqProvider only)
#   langgraph     - workflow orchestration graph (Phase 8, orchestration only)
# Provider SDKs and frameworks are added only when the layer that needs them
# lands; other vendors remain out until their phases.
dependencies = [
    "pydantic>=2.9",
    "google-genai>=2.0",
    "groq>=0.11",
    "langgraph>=0.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.urls]
Repository = "https://github.com/kit29-25bad132/llm-orchestrator"

[tool.hatch.build.targets.wheel]
packages = ["src/llm_orchestrator"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Lets reusable test-only helpers under tests/support/ be imported as
# `support.*` without a top-level conftest or package restructuring.
pythonpath = ["tests"]
addopts = "-ra --strict-markers --strict-config"
markers = [
    "live: tests that call real provider APIs (opt-in; skipped by default)",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
# Prose documentation is not Python; keep ruff away from markdown (its code
# fences are illustrative, not sources ruff should rewrite).
extend-exclude = ["docs", "README.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
strict = true
files = ["src"]
plugins = ["pydantic.mypy"]
