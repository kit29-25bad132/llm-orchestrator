[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "llm-orchestrator"
version = "0.1.0"
description = "A reusable, provider-agnostic LLM orchestration library."
readme = "README.md"
requires-python = ">=3.11"
keywords = ["llm", "orchestration", "providers", "reliability", "abstraction"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]

# Runtime dependencies are intentionally empty in Phase 1.
# Contracts, providers, and orchestration are implemented in later phases, and
# each dependency will be added only when the code that needs it lands.
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.urls]
Repository = "https://github.com/kit29-25bad132/llm-orchestrator"

[tool.hatch.build.targets.wheel]
packages = ["src/llm_orchestrator"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
markers = [
    "live: tests that call real provider APIs (opt-in; skipped by default)",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
# Prose documentation is not Python; keep ruff away from the Phase 0 docs.
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
strict = true
files = ["src"]
